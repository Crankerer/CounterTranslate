name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Cache Nuitka
        uses: actions/cache@v4
        with:
          path: ${{ env.LOCALAPPDATA }}\Nuitka
          key: nuitka-${{ runner.os }}-${{ hashFiles('app/**/*.py', 'launcher.py') }}
          restore-keys: nuitka-${{ runner.os }}-

      - name: Install dependencies
        run: pip install -r requirements.txt nuitka pillow ordered-set zstandard

      - name: Build
        shell: cmd
        env:
          BUILD_VERSION: ${{ github.ref_name }}
        run: build.bat

      - name: Create ZIP
        shell: pwsh
        run: Compress-Archive -Path dist\CounterTranslate -DestinationPath CounterTranslate-windows-x64.zip

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create ${{ github.ref_name }} CounterTranslate-windows-x64.zip --generate-notes
